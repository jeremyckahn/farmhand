name: CI

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
    branches:
      - '**'
      - '!main'

jobs:
  lint_test_type:
    runs-on: ubuntu-latest
    # Skip pull_request runs for same-repo PRs (already covered by the push
    # trigger), but run for fork PRs, where push never fires in this repo.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Install E2E dependencies'
        run: cd e2e && npm ci

      - name: 'Lint code'
        run: npm run lint

      - name: 'Run unit tests'
        run: npm test -- --coverage

      - name: 'Check types'
        run: npm run check:types

  build:
    runs-on: ubuntu-latest
    # Same gating as lint_test_type: avoid duplicate runs on same-repo PRs.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Build web app artifacts'
        run: |
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist

  e2e:
    runs-on: ubuntu-latest
    # Requires VERCEL_TOKEN, which GitHub does not expose to pull_request
    # workflow runs triggered from forks, so this only runs on push.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install E2E dependencies and browsers
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps

      - name: Start backend Redis services
        run: docker compose up -d

      - name: Run E2E tests
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run e2e
